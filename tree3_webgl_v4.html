async function prepareStream(){

  let corsOK=false;
  try{
    const response=await fetch(STREAM_URL,{mode:'cors',cache:'no-store',signal:AbortSignal.timeout(4500)});
    corsOK=response.ok && response.type==='cors';
    if(response.body)await response.body.cancel();

    audio.crossOrigin='anonymous';

    try{
      audioContext=new (window.AudioContext||window.webkitAudioContext)();
      const source=audioContext.createMediaElementSource(audio);

      analysisAvailable=true;
      console.info('TREE(3): browser audio analysis enabled');
    }catch(e){console.warn('TREE(3): analyzer setup failed',e)}

});

  const hi=Math.min(frequencyData.length-1,Math.ceil(high/binHz));

  for(let i=lo;i<=hi;i++)sum+=frequencyData[i]/255;

function updateAudioAnalysis(dt){

    for(const key of ['bass','mid','high','presence','air']){

    // No overall RMS, bass or midrange contribution to the orange onset.

    d.hit=0;d.crash=0;

    const active= Math.max(rms/.022,raw.high/.07,raw.mid/.06);

    d.silence+=(silenceTarget-d.silence)*(1-Math.exp(-dt*(silenceTarget?9:16)));

    d.structure+=(structureTarget-d.structure)*(1-Math.exp(-dt*(structureTarget>d.structure?7:4)));

    d.bassGlow+=(bassTarget-d.bassGlow)*(1-Math.exp(-dt*(bassTarget>d.bassGlow?24:8)));

    for(const key of Object.keys(a))a[key]*=Math.exp(-dt*5);
    for(const key of ['bass','mid','high','presence','air','lowMid','brightPulse','level','trebleBeat','bassGlow','structure'])d[key]*=Math.exp(-dt*5);

function applyMidi(message){
  if(!message || typeof message!=='object')return;
  const event=message.event||message.subtype;
  const note=Number(message.note),velocity=Number(message.velocity??0);
  const channel=Number(message.channel??1);

    visual.midi.pulse=Math.max(visual.midi.pulse,Math.min(1,velocity/127));
  }else if((event==='note_off'||(event==='note_on'&&velocity===0))&&Number.isFinite(note)){
    visual.midi.notes.delete(channel+':'+note);
  }else if(event==='cc'){
    const controller=Number(message.controller??message.cc),value=Number(message.value);
    if(Number.isFinite(controller)&&Number.isFinite(value))visual.midi.cc.set(channel+':'+controller,Math.max(0,Math.min(1,value/127)));

function updateComposition(dt){

  visual.midi.pulse*=Math.exp(-dt*10);

let telemetrySocket=null;
function connectTelemetry(){
  if(!TELEMETRY_WS_URL)return;
  let retry=1500;
  function connect(){
    try{
      telemetrySocket=new WebSocket(TELEMETRY_WS_URL);
      telemetrySocket.onopen=()=>{visual.connected=true;retry=1500};

      };

      telemetrySocket.onerror=()=>telemetrySocket.close();
    }catch(e){setTimeout(connect,retry);retry=Math.min(30000,retry*1.6)}

}

// Local MIDI is opt-in and is intended for development or a private control page.
async function enableLocalMidi(){
  if(!navigator.requestMIDIAccess)throw new Error('Web MIDI unavailable in this browser');
  const access=await navigator.requestMIDIAccess({sysex:false});
  const attach=()=>{
    for(const input of access.inputs.values())input.onmidimessage=e=>{
      const [status,data1,data2]=e.data,command=status&0xf0,channel=(status&0x0f)+1;
      if(command===0x90)applyMidi({event:'note_on',note:data1,velocity:data2,channel});
      else if(command===0x80)applyMidi({event:'note_off',note:data1,velocity:data2,channel});
      else if(command===0xb0)applyMidi({event:'cc',controller:data1,value:data2,channel});
      else if(command===0xe0)applyMidi({event:'pitch_bend',value:data1+data2*128,channel});
    };
  };
  attach();access.onstatechange=attach;
  return access;
}

   vec3 pos=vec3(a*cos(theta),a*sin(theta),r*sin(phi));
   float spatial=sin(uMode*theta+phi*.35);
   float oscillation=sin(uTime*uRate+phi*.6);
   float secondary=.18*sin((uMode+2.)*theta-uTime*uRate*.58+phi*.35);
   float envelope=pow(clamp(uBand,0.,1.),.72);
   float deflection=uMinor*uGain*envelope*(spatial*oscillation+secondary);
   pos.xy+=vec2(cos(theta),sin(theta))*deflection*.72;
   pos.z+=deflection*.69;
   // Fan strands separate in the local cross-section (rather than screen space).
   float fan=(uFrequency<4.?11.:5.8)*uBand*params.z*.0027;
   pos.xy+=vec2(cos(theta),sin(theta))*fan;
   pos.z+=fan*.40;
   float cr=cos(uTime*.028),sr=sin(uTime*.028);
   vec2 rot=vec2(pos.x*cr-pos.y*sr,pos.x*sr+pos.y*cr);
   float yy=rot.y*sin(uPitch)+pos.z*cos(uPitch);
   float zTilt=rot.y*cos(uPitch)-pos.z*sin(uPitch);
   float xx=rot.x*cos(uYaw)+zTilt*sin(uYaw);
   float zz=-rot.x*sin(uYaw)+zTilt*cos(uYaw);
   float perspective=3.7/(3.7-zz*.22);
   vDepth=clamp((zz+1.5)/3.,0.,1.);
   return projectionMatrix*modelViewMatrix*vec4(xx*perspective*uZoom,yy*perspective*uZoom,0.,1.);
 }
 void main(){
   vec4 p=curvePoint(aParams);
   if(uStrokePx>0.01){
     vec4 q=curvePoint(aEndParams);
     vec2 delta=(q.xy/q.w-p.xy/p.w)*uViewport;
     vec2 normal=vec2(-delta.y,delta.x)/max(length(delta),.0001);
     p.xy+=normal*aSide*uStrokePx*2.0*p.w/uViewport;
   }
   gl_Position=p;
 }
`;
const fragmentShader=`
 precision highp float;
 uniform vec3 uColor;
 uniform float uBand,uAlpha,uBrightness,uHalo;
 varying float vDepth;
 void main(){
   float a=(.24+.62*vDepth)*uAlpha;
   a*=mix(1.0,.56,uHalo);
   a*=1.+uBrightness*uBand;
   gl_FragColor=vec4(uColor,min(.95,a));
 }
`;
const materials=[];
function makeLines(ring,k,offset,alpha,stepCount,strokePx=0,halo=0){
 const values=[],ends=[],sides=[];
 const add=(theta,phi,side,endTheta)=>{values.push(theta,phi,offset);ends.push(endTheta,phi,offset);sides.push(side)};
 for(let j=0;j<ring.filaments;j++){
   const phi=j/ring.filaments*Math.PI*2;
   for(let i=0;i<stepCount;i++){
     const t0=i/stepCount*Math.PI*2,t1=(i+1)/stepCount*Math.PI*2;
     if(strokePx>0){
       // Two triangles, shader expands to a screen-space ribbon; works in Firefox/WebGL1.
       add(t0,phi,-1,t1);add(t0,phi,1,t1);add(t1,phi,-1,t0);
       add(t1,phi,-1,t0);add(t0,phi,1,t1);add(t1,phi,1,t0);
     }else{add(t0,phi,0,t1);add(t1,phi,0,t0)}
   }
 }
 const geometry=new THREE.BufferGeometry();
 geometry.setAttribute('position',new THREE.BufferAttribute(new Float32Array(values),3));
 geometry.setAttribute('aParams',new THREE.BufferAttribute(new Float32Array(values),3));
 geometry.setAttribute('aEndParams',new THREE.BufferAttribute(new Float32Array(ends),3));
 geometry.setAttribute('aSide',new THREE.BufferAttribute(new Float32Array(sides),1));
 const u={
   uTime:{value:0},uYaw:{value:0},uPitch:{value:0},uZoom:{value:1},
   uBand:{value:0},uBeat:{value:0},uStructure:{value:0},uPhase:{value:0},uBassGlow:{value:0},
   uMajor:{value:ring.major},uMinor:{value:ring.minor},uFrequency:{value:ring.frequency},
   uVelocity:{value:ring.velocity},uTwist:{value:ring.twist},
   uMode:{value:k===0?3:k===1?6:11},uRate:{value:k===0?5.8:k===1?9.5:14},
   uGain:{value:k===0?.44:k===1?.34:.32},
   uColor:{value:new THREE.Vector3(...ring.rgb.map(v=>v/255))},uAlpha:{value:alpha},
   uBrightness:{value:k===0?2.2:k===1?2.0:3.1},
   uStrokePx:{value:strokePx*Math.min(devicePixelRatio||1,1.5)},uViewport:{value:new THREE.Vector2(1,1)},uHalo:{value:halo}
 };
 const material=new THREE.ShaderMaterial({uniforms:u,vertexShader,fragmentShader,transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending});
 const mesh=strokePx>0?new THREE.Mesh(geometry,material):new THREE.LineSegments(geometry,material);
 mesh.frustumCulled=false;scene.add(mesh);materials.push({u,k});
}
for(let k=0;k<rings.length;k++){
 const ring=rings[k];const steps=k===2?600:k===1?400:320;
 // Wide dim halo, close inner glow, and a luminous fine core.
 makeLines(ring,k,0,.10,steps,5.5,1);
 makeLines(ring,k,0,.22,steps,2.0,1);
 makeLines(ring,k,0,.88,steps);
 if(k<2){for(const offset of [-1,-.65,-.32,.32,.65,1])makeLines(ring,k,offset,.15,steps)}
}
function render(t){
 const d=visual.dynamics;
 for(const {u,k} of materials){
  const ring=rings[k];
  u.uViewport.value.set(renderer.domElement.width,renderer.domElement.height);
  u.uTime.value=t;u.uYaw.value=camera.yaw;u.uPitch.value=camera.pitch;u.uZoom.value=camera.zoom;
  u.uBand.value=clamp(d[ring.band],0,1);
  u.uBeat.value=k===2?d.trebleBeat:clamp(bandOnsets[ring.band]*7,0,1);
  u.uStructure.value=clamp(d.structure,0,1);u.uPhase.value=d.phase;
  u.uBassGlow.value=d.bassGlow;
 }
 renderer.render(scene,gpuCamera);
}
// Diagnostics: open browser console and run TREE3.diagnostics() during playback.
window.TREE3.diagnostics=()=>({analysisAvailable,audioContext:audioContext?.state,
  raw:{...visual.audio},onsets:{...bandOnsets},dynamics:{...visual.dynamics},
  playback:audio.paused?'paused':'playing'});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduced){render(0)}else{
 let prev=0;
 function frame(ms){
   const dt=Math.min(.05,(ms-prev)/1000||.016);prev=ms;
    updateAudioAnalysis(dt);updateComposition(dt);
   if(!pointers.size){
     camera.yaw+=camera.vyaw*dt*60;camera.pitch=clamp(camera.pitch+camera.vpitch*dt*60,-1.48,1.48);
     const decay=Math.pow(.90,dt*60);camera.vyaw*=decay;camera.vpitch*=decay;
     // Quiet ambient motion after the user's spin comes to rest.
     camera.yaw+=dt*.018;
   }
   render(ms*.001);requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
}
