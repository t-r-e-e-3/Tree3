<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b14}body{font-family:system-ui,sans-serif}.scene{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 48%,#172942 0%,#0c1729 48%,#070b14 100%)}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas.rotating{cursor:grabbing}.controls{position:fixed;left:50%;top:calc(100% - 100px);transform:translateX(-50%);touch-action:none;user-select:none;cursor:grab;display:flex;align-items:center;gap:18px;padding:11px 19px;border:1px solid #a8c7e329;background:#091423b8;backdrop-filter:blur(22px);border-radius:999px;box-shadow:0 12px 45px #0006;transition:opacity .2s}.controls.dragging{cursor:grabbing}.control{touch-action:manipulation;appearance:none;border:0;background:none;color:#d9f4f5;display:grid;place-items:center;cursor:pointer;width:34px;height:34px;padding:0}.control svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.control.primary{width:46px;height:46px;background:#a8edf0;border-radius:50%;color:#081722}.control.primary svg{width:22px;height:22px}.control:focus-visible,input:focus-visible{outline:2px solid #b8f8f7;outline-offset:5px}.control:hover{color:#fff}.control.primary:hover{background:#d7ffff}.volume{touch-action:pan-x;width:96px;accent-color:#a8edf0;cursor:pointer}.hidden{display:none!important}@media(max-width:500px){.controls{gap:12px;padding:9px 14px}.volume{width:75px}}@media(prefers-reduced-motion:reduce){.controls{transition:none}}
#halo{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:normal;opacity:1;z-index:1}.controls{z-index:3}
#haloToggle{display:none;position:fixed;right:18px;bottom:20px;z-index:5;background:#0b1827dd;color:#b6d9e5;border:1px solid #69859b66;border-radius:20px;padding:9px 13px;cursor:pointer;font:12px system-ui,sans-serif}#haloToggle:hover{background:#20334a}

#diagnostics{display:none;position:fixed;left:16px;top:16px;z-index:8;width:min(360px,calc(100vw - 32px));padding:14px;border-radius:13px;background:#071321eb;border:1px solid #67839988;color:#e3eff5;font:12px system-ui,sans-serif;backdrop-filter:blur(14px);box-shadow:0 12px 36px #0008}
#diagnostics h2{margin:0 0 8px;font-size:14px}#diagnostics .status{font-size:11px;color:#afc5d5;margin-bottom:10px;line-height:1.45}
.diagRow{display:grid;grid-template-columns:54px 1fr 44px;align-items:center;gap:8px;margin:9px 0}.diagBars{display:grid;gap:3px}.diagTrack{height:7px;border-radius:4px;background:#243546;overflow:hidden}.diagFill{height:100%;width:0%;transition:none}.diagRaw{opacity:.6}.diagNumbers{font-variant-numeric:tabular-nums;text-align:right;color:#bdd0de;font-size:10px}.diagButtons{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.diagButtons button{border:1px solid #59758a;background:#182c40;color:#d5e9f2;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:11px}.diagFoot{margin-top:9px;font-size:10px;line-height:1.5;color:#a7baca}.diagHit{font-weight:700;opacity:.35}.diagHit.fired{opacity:1;color:#fff}
/* Pluck circles live inside the draggable radio-player pill. */
.pluckGroup{display:flex;align-items:center;gap:11px;padding-left:14px;border-left:1px solid #a8c7e33a}
.pluckOrb{width:31px;height:31px;flex:none;border:1px solid #ffffff55;border-radius:50%;cursor:pointer;padding:0;box-shadow:0 0 13px var(--orb-glow),inset 0 0 10px #ffffff22;background:radial-gradient(circle at 34% 28%,#ffffff99 0%,var(--orb) 38%,var(--orb-dark) 100%);transition:transform .1s,box-shadow .1s}
.pluckOrb:hover{transform:scale(1.1);box-shadow:0 0 20px var(--orb-glow)}
.pluckOrb:active{transform:scale(.88)}.pluckOrb:focus-visible{outline:2px solid white;outline-offset:4px}
@media(max-width:500px){.controls{gap:9px;padding:9px 11px}.volume{width:60px}.pluckGroup{gap:7px;padding-left:9px}.pluckOrb{width:27px;height:27px}}
/* Three minimal live meters; preserve the existing DOM IDs for diagnostic updates. */
#diagnostics{width:210px;padding:14px;border-radius:14px}
#diagnostics #diagRows{display:grid;gap:12px}
#diagnostics .diagRow{display:block;margin:0}
#diagnostics .diagTrack{height:10px;border-radius:999px;background:#24354677;overflow:hidden}
#diagnostics .diagFill{height:100%;border-radius:999px}
/* Single GPU state indicator: illuminated means enabled, grey means disabled. */
#haloToggle{width:34px;height:34px;padding:0;border-radius:50%;background:#505760;border:1px solid #88929b;box-shadow:none;font-size:0}
#haloToggle.gpu-on{background:#4ee2d2;border-color:#a3fff1;box-shadow:0 0 15px #4ee2d288,inset 0 0 7px #ffffff55}
#haloToggle:hover{filter:brightness(1.2)}
/* Independent geometry controls remain attached to the player. */
.geometryGroup{display:flex;align-items:center;gap:9px;padding-left:13px;border-left:1px solid #a8c7e33a}
.geometryOrb{width:32px;height:32px;flex:none;display:grid;place-items:center;cursor:pointer;border-radius:50%;border:1px solid #8293a0;background:#454c57;color:#bac3cb;padding:5px;transition:background .15s,box-shadow .15s}
.geometryOrb svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.geometryOrb.active{background:#244d59;color:#b5fff4;border-color:#5bdfd2;box-shadow:0 0 12px #4ee2d255}
.geometryOrb:hover{filter:brightness(1.2)}.geometryOrb:focus-visible{outline:2px solid white;outline-offset:3px}
@media(max-width:600px){.geometryGroup{gap:6px;padding-left:8px}.geometryOrb{width:27px;height:27px}.controls{gap:8px;padding:8px 10px}.volume{width:54px}}
/* v26: restore v22-style single-row circular pluck controls. */
.controls{flex-direction:row;gap:12px!important;border-radius:999px;padding:11px 16px!important;top:calc(100% - 100px)}
.playerTop{display:flex;align-items:center;gap:12px;width:auto}
.controls .pluckGroup{display:flex;align-items:center;gap:9px;width:auto;padding:0 0 0 12px;border-top:0;border-left:1px solid #a8c7e33a}
.controls .pluckOrb{width:31px;height:31px;min-width:31px;flex:none;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ffffff99 0%,var(--orb) 38%,var(--orb-dark) 100%);box-shadow:0 0 13px var(--orb-glow),inset 0 0 10px #ffffff22}
.controls .pluckOrb:hover{transform:scale(1.1);filter:none;box-shadow:0 0 20px var(--orb-glow)}
.controls .pluckOrb:active{transform:scale(.88)}
@media(max-width:600px){.controls{gap:7px!important;padding:8px 9px!important}.playerTop{gap:7px}.controls .pluckGroup{gap:5px;padding-left:7px}.controls .pluckOrb{width:24px;height:24px;min-width:24px}.volume{width:48px}.geometryGroup{gap:5px;padding-left:7px}.geometryOrb{width:25px;height:25px}}
/* Immersive fullscreen: controls disappear only after fullscreen succeeds. */
.controls.immersive-hidden{display:none!important}
.fullscreenControl{width:30px;height:32px;flex:none}
.fullscreenControl svg{width:19px;height:19px}
@media(max-width:600px){.playerTop{gap:7px}.fullscreenControl{width:25px}}

/* v28: tap for one pluck; press and hold for a textless repetition-rate fader. */
.pluckGroup{position:relative}
.pluckFader{position:fixed;z-index:80;width:52px;height:184px;display:none;flex-direction:column;align-items:center;gap:0;padding:14px 8px;background:#091423ed;border:1px solid #7792a477;border-radius:22px;box-shadow:0 12px 32px #0009;backdrop-filter:blur(12px);touch-action:none}
.pluckFader.open{display:flex}
.pluckFader input[type=range]{appearance:slider-vertical;-webkit-appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;width:30px;height:154px;cursor:pointer;accent-color:var(--orb);touch-action:none}

.pluckOrb.running{outline:2px solid var(--orb);outline-offset:3px;animation:pluckPulse 1.4s ease-in-out infinite}
@keyframes pluckPulse{50%{box-shadow:0 0 24px var(--orb),inset 0 0 10px #ffffff44}}

/* Mobile two-tier draggable controls. Desktop markup and initial scene are unchanged. */
.mobileMain{display:none;align-items:center;justify-content:center;gap:13px;width:100%}
.mobileSub{display:none;position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-50%);align-items:center;justify-content:center;gap:10px;padding:9px 13px;background:#091423dc;border:1px solid #a8c7e329;border-radius:999px;box-shadow:0 12px 38px #0009;backdrop-filter:blur(22px);white-space:nowrap;touch-action:none}
.mobileSub.expanded{display:flex}
.mobileMain .streamOrb,.mobileMain .expandOrb{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid #ffffff77;cursor:pointer;appearance:none;touch-action:manipulation;transition:opacity .16s,filter .16s,box-shadow .16s;background:radial-gradient(circle at 32% 24%,#ffffffaa 0%,var(--color) 40%,var(--dark) 100%);box-shadow:0 0 15px var(--glow),inset 0 0 9px #ffffff55}
.mobileMain .streamOrb[aria-pressed="false"],.mobileMain .expandOrb[aria-expanded="false"]{opacity:.38;filter:grayscale(.8);box-shadow:0 0 5px #0005,inset 0 0 8px #0007}
.mobileMain .streamOrb:focus-visible,.mobileMain .expandOrb:focus-visible{outline:2px solid white;outline-offset:4px}
body.ios-native .controls{padding:11px 16px!important;min-width:190px;justify-content:center}
body.ios-native .playerTop{display:none!important}
body.ios-native .mobileMain{display:flex}
body.ios-native .mobileSub .pluckGroup{border-left:0;padding-left:0;gap:9px}
body.ios-native .mobileSub .geometryGroup{gap:8px;padding-left:10px}
body.ios-native .mobileSub .pluckOrb{width:31px;height:31px;min-width:31px}
body.ios-native .mobileSub .geometryOrb{width:30px;height:30px}
@media(max-width:500px){body.ios-native .mobileSub{gap:6px;padding:8px 9px}body.ios-native .mobileSub .pluckGroup{gap:6px}body.ios-native .mobileSub .geometryGroup{gap:5px;padding-left:7px}body.ios-native .mobileSub .pluckOrb{width:27px;height:27px;min-width:27px}body.ios-native .mobileSub .geometryOrb{width:26px;height:26px}body.ios-native .mobileSub .fullscreenControl{width:25px}}

<body>
<main class="scene"><canvas id="art" role="img" aria-label="Three nested luminous toroidal waveform structures: drone, harmony, and texture"></canvas><canvas id="halo" aria-hidden="true"></canvas></main><button id="haloToggle" type="button" aria-pressed="false" aria-label="GPU enabled" title="GPU effects on"></button>
<div class="controls" id="controls" role="group" aria-label="Radio player controls" title="Drag empty space to reposition; double-click empty space to reset">
<div class="mobileMain" role="group" aria-label="Mobile primary controls">
<button type="button" class="expandOrb" id="mobileExpand" aria-label="Show visual controls" aria-expanded="false" title="Show or hide visual controls" style="--color:#67ed9c;--dark:#147b44;--glow:#52ec8c99"></button>
<button type="button" class="streamOrb" id="pranaOrb" aria-label="Turn Prana on" aria-pressed="false" title="Prana" style="--color:#ae79f9;--dark:#5c29a8;--glow:#a66bff99"></button>
<button type="button" class="streamOrb" id="akashaOrb" aria-label="Turn Akasha on" aria-pressed="false" title="Akasha" style="--color:#ff9a37;--dark:#b74708;--glow:#ff852a99"></button>
</div>
<div class="mobileSub" id="mobileSub" role="group" aria-label="Visual and geometry controls"></div>
<div class="playerTop">
<button class="control primary" id="play" aria-label="Play radio" title="Play or pause">
<svg id="playIcon" viewBox="0 0 24 24"><path d="M9 6l10 6-10 6z" fill="currentColor" stroke="none"/></svg>
</button>
<button class="control" id="mute" aria-label="Mute audio" title="Mute or unmute">
<svg id="speakerIcon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
</button>
<input class="volume" id="volume" aria-label="Volume" type="range" min="0" max="1" step="0.01" value="0.5">
<input class="volume" id="pranaVolume" aria-label="Prana volume" title="Prana volume" type="range" min="0" max="1" step="0.01" value="0.25" style="accent-color:#af9eff">

<div class="pluckGroup" role="group" aria-label="Live visual test plucks">
<button class="pluckOrb" id="diagTestBass" aria-label="Test bass pluck" title="Bass pluck" style="--orb:#4ee2d2;--orb-dark:#087e75;--orb-glow:#4ee2d288"></button>
<button class="pluckOrb" id="diagTestMid" aria-label="Test mid pluck" title="Mid pluck" style="--orb:#af9eff;--orb-dark:#6040a8;--orb-glow:#af9eff88"></button>
<button class="pluckOrb" id="diagTestHigh" aria-label="Test high pluck" title="High pluck" style="--orb:#f5b27d;--orb-dark:#b05c21;--orb-glow:#f5b27d88"></button>
</div>
<div class="geometryGroup" role="group" aria-label="Geometry visibility">
<button class="geometryOrb active" id="torusGeometry" type="button" aria-label="Toggle torus" title="Torus on/off" aria-pressed="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="5"/><ellipse cx="12" cy="12" rx="5" ry="2"/></svg></button>
<button class="geometryOrb" id="hyperGeometry" type="button" aria-label="Toggle hyperboloids" title="Hyperboloids on/off" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 2 Q17 12 3 22 M21 2 Q7 12 21 22"/><ellipse cx="12" cy="12" rx="5" ry="2"/></svg></button>
<button class="control fullscreenControl" id="enterFullscreen" type="button" aria-label="Enter fullscreen and hide controls" title="Fullscreen (Esc to return)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
</div>
</div>

</div>
<div id="pluckFaders" aria-label="Pluck repetition speed sliders"></div>
<audio id="stream" preload="none"></audio>
<audio id="pranaStream" preload="none"></audio>

<section id="diagnostics" aria-label="Live filament levels"><div id="diagStatus" hidden></div><div id="diagRows"></div></section>

<script>
// After setting up your broadcast server, paste its direct HTTPS audio stream URL here.
const STREAM_URL = "https://akasha.tree3.stream/listen/tree3/radio.mp3";
const PRANA_STREAM_URL = "https://prana.tree3.stream:8443/prana.mp3";
// Leave null until Akasha has a secure, authenticated visual telemetry endpoint.
const TELEMETRY_WS_URL = null; // Set to your authenticated WSS receive-only bridge URL, e.g. "wss://your-domain.example/live-visuals"

// Draggable player: grab the pill background, not its buttons or volume slider.
const controls=document.getElementById('controls');
const POSITION_KEY='shift-wave-player-position-v04';
let drag=null;
function setPlayerPosition(x,y){
  const r=controls.getBoundingClientRect();
  x=Math.max(0,Math.min(innerWidth-r.width,x));
  y=Math.max(0,Math.min(innerHeight-r.height,y));
  controls.style.left=x+'px';controls.style.top=y+'px';controls.style.transform='none';
}
function restorePlayer(){
  try{const pos=JSON.parse(localStorage.getItem(POSITION_KEY));
    if(pos&&Number.isFinite(pos.x)&&Number.isFinite(pos.y))setPlayerPosition(pos.x*innerWidth,pos.y*innerHeight);
  }catch(e){}
}
controls.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,input'))return;
  const r=controls.getBoundingClientRect();
  drag={id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top};
  controls.setPointerCapture(e.pointerId);controls.classList.add('dragging');e.preventDefault();
});
controls.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id)setPlayerPosition(e.clientX-drag.dx,e.clientY-drag.dy)});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;
  drag=null;controls.classList.remove('dragging');
  const r=controls.getBoundingClientRect();
  try{localStorage.setItem(POSITION_KEY,JSON.stringify({x:r.left/innerWidth,y:r.top/innerHeight}))}catch(e){}
}
controls.addEventListener('pointerup',endDrag);controls.addEventListener('pointercancel',endDrag);
controls.addEventListener('dblclick',e=>{if(e.target.closest('button,input'))return;
  try{localStorage.removeItem(POSITION_KEY)}catch(e){}
  controls.style.left='50%';controls.style.top='calc(100% - 100px)';controls.style.transform='translateX(-50%)';
});
addEventListener('resize',()=>{if(controls.style.transform==='none'){
  const r=controls.getBoundingClientRect();setPlayerPosition(r.left,r.top)
}});
requestAnimationFrame(restorePlayer);
// Fullscreen is entered by user gesture; browser Escape restores the player.
const fullscreenButton=document.getElementById('enterFullscreen');
function syncFullscreenUI(){
  controls.classList.toggle('immersive-hidden',Boolean(document.fullscreenElement));
}
fullscreenButton.addEventListener('click',async()=>{
  try{
    if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(err){console.warn('Fullscreen could not be entered:',err)}
  syncFullscreenUI();
});
document.addEventListener('fullscreenchange',syncFullscreenUI);
// Optional F key also exits fullscreen, useful if Escape is unavailable.
document.addEventListener('keydown',e=>{
  if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&
     !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&document.fullscreenElement){
    e.preventDefault();document.exitFullscreen().catch(()=>{});
  }
});
const audio=document.getElementById('stream');
const pranaAudio=document.getElementById('pranaStream');
// Independent transparent Web Audio gain stages. Only route a stream after
// verifying that its server permits CORS; otherwise retain direct playback.
const play=document.getElementById('play');
const playIcon=document.getElementById('playIcon');
const mute=document.getElementById('mute');
const speakerIcon=document.getElementById('speakerIcon');
const volume=document.getElementById('volume');
const pranaVolume=document.getElementById('pranaVolume');
const playSvg='<path d="M9 6l10 6-10 6z" fill="currentColor" stroke="none"/>';
const pauseSvg='<path d="M8 5v14M16 5v14"/>';
const speakerSvg='<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M18.5 6a9 9 0 0 1 0 12"/>';
const mutedSvg='<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/>';
// iOS Safari currently bypasses the Web Audio graph for our continuous MP3 streams.
// Use proven native media controls instead of misleading software volume sliders.
const iosNativePlayback=/iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
if(iosNativePlayback){
  // Reuse the original filament and geometry controls, preserving their handlers.
  const mobileSub=document.getElementById('mobileSub');
  mobileSub.append(document.querySelector('.pluckGroup'),document.querySelector('.geometryGroup'));
  const expand=document.getElementById('mobileExpand');
  expand.addEventListener('click',()=>{
    const open=expand.getAttribute('aria-expanded')!=='true';
    expand.setAttribute('aria-expanded',String(open));
    expand.setAttribute('aria-label',open?'Hide visual controls':'Show visual controls');
    mobileSub.classList.toggle('expanded',open);
  });
  document.body.classList.add('ios-native');
  volume.value='0.55';
  pranaVolume.value='0.25';
}
const streams=[
  {name:'Akasha',element:audio,url:STREAM_URL,slider:volume,gain:null,routed:false},
  {name:'Prana',element:pranaAudio,url:PRANA_STREAM_URL,slider:pranaVolume,gain:null,routed:false}
];
let mixingContext=null;
let mixingPrepared=false;
let mixingPreparation=null;
let globallyMuted=false;
// These are requested relative levels; iOS Safari may ignore element.volume.
const iosRequestedLevels={Akasha:0.55,Prana:0.25};
const mobileOrbs={Akasha:document.getElementById('akashaOrb'),Prana:document.getElementById('pranaOrb')};

function setGain(stream){
  const value=globallyMuted?0:Number(stream.slider.value);
  if(iosNativePlayback){
    stream.element.muted=globallyMuted || value===0;
    stream.element.volume=iosRequestedLevels[stream.name];
  }else if(stream.routed&&stream.gain){
    stream.gain.gain.setTargetAtTime(value,mixingContext.currentTime,0.012);
  }else{
    // Fallback for servers without CORS. Some mobile browsers fix element volume.
    stream.element.volume=value;
    stream.element.muted=globallyMuted;
  }
}
function syncControls(){
  const playing=streams.some(s=>!s.element.paused);
  playIcon.innerHTML=playing?pauseSvg:playSvg;
  play.setAttribute('aria-label',playing?'Pause radio':'Play radio');
  speakerIcon.innerHTML=globallyMuted||streams.every(s=>Number(s.slider.value)===0)?mutedSvg:speakerSvg;
  mute.setAttribute('aria-label',globallyMuted?'Unmute audio':'Mute audio');
  if(iosNativePlayback)for(const stream of streams){
    const orb=mobileOrbs[stream.name];
    const on=!stream.element.paused && !stream.element.muted;
    orb.setAttribute('aria-pressed',String(on));
    orb.setAttribute('aria-label',(on?'Turn ':'Turn ')+stream.name+(on?' off':' on'));
    orb.title=stream.name+(on?' — on':' — off');
  }
}
for(const stream of streams){
  stream.element.src=stream.url;
  stream.element.volume=iosNativePlayback?iosRequestedLevels[stream.name]:Number(stream.slider.value);
  stream.slider.addEventListener('input',()=>{setGain(stream);syncControls()});
  if(iosNativePlayback){
    stream.element.muted=false;
    stream.element.pause();
  }
}
// On iPhone, the two floating circles are the only playback switches.
// Each tap is a direct user gesture so Safari can authorize audio playback.
if(iosNativePlayback)for(const stream of streams){
  mobileOrbs[stream.name].addEventListener('click',async()=>{
    if(!stream.element.paused){
      stream.element.pause();
    }else{
      stream.element.muted=false;
      stream.element.volume=iosRequestedLevels[stream.name];
      try{await stream.element.play()}catch(err){console.error(stream.name+' playback failed',err)}
    }
    syncControls();
  });
  stream.element.addEventListener('play',syncControls);
  stream.element.addEventListener('pause',syncControls);
  stream.element.addEventListener('error',syncControls);
}
mute.addEventListener('click',()=>{
  globallyMuted=!globallyMuted;
  for(const stream of streams)setGain(stream);
  syncControls();
});
// CORS probe does not attach Web Audio to an unsupported stream. A failed probe
// cannot silence the audio, because that stream stays in the original path.
async function corsAllowsAudio(url){
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),4500);
    try{
      const response=await fetch(url,{mode:'cors',cache:'no-store',signal:controller.signal});
      if(response.body)response.body.cancel().catch(()=>{});
      return response.ok && (response.type==='cors'||response.type==='basic');
    }finally{clearTimeout(timeout)}
  }catch(err){console.info('TREE(3): gain routing unavailable for',url,err);return false}
}
async function prepareMixing(){
  if(iosNativePlayback)return; // Native iOS media playback; no ineffective Web Audio graph.
  if(mixingPrepared)return;
