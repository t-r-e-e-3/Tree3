// Browser-side audio analysis; only attach a MediaElementAudioSource after a CORS check.

async function prepareStream(){
  if(streamPrepared)return;

  try{
    const response=await fetch(STREAM_URL,{mode:'cors',cache:'no-store',signal:AbortSignal.timeout(4500)});
    corsOK=response.ok && response.type==='cors';
    if(response.body)await response.body.cancel();

    audio.crossOrigin='anonymous';
    audio.src=STREAM_URL;
    try{

    }catch(e){console.warn('TREE(3): analyzer setup failed',e)}

    audio.removeAttribute('crossorigin');

  const hi=Math.min(frequencyData.length-1,Math.ceil(high/binHz));

  for(let i=lo;i<=hi;i++)sum+=frequencyData[i]/255;

// Independent musical envelopes: sustained energy affects optical weight;
// spectral attacks excite damped transverse string modes.
const stringMotion={
 bass:{pluck:0,phase:0,previous:0,noise:0},
 mid:{pluck:0,phase:0,previous:0,noise:0},
 high:{pluck:0,phase:0,previous:0,noise:0}
};
function advanceStringMotion(dt,raw,flux,active){

   const m=stringMotion[key];
   const level=active?raw[key]:0;
   // Positive derivative of band energy, plus new spectral content.
   const velocity=Math.max(0,level-m.previous)/Math.max(dt,.008);
   m.previous=level;
   const event=clamp(velocity*(key==='bass'?.65:key==='mid'?.8:.95)+flux[key]*(key==='bass'?21:key==='mid'?28:32),0,1);

                     clamp(impulse*(key==='bass'?2.5:key==='mid'?2.7:2.8),0,1));

function updateAudioAnalysis(dt){

    analyser.getByteFrequencyData(frequencyData);
    analyser.getByteTimeDomainData(timeData);
    let power=0;
    for(let i=0;i<timeData.length;i++){
      const v=(timeData[i]-128)/128;power+=v*v;
    }

    // Fast attack and slow release preserve the shape of cymbal crashes and kicks.
    const raw={
      bass:bandEnergy(30,179), mid:bandEnergy(180,2199), high:bandEnergy(2200,11000),
      presence:bandEnergy(850,4200), air:bandEnergy(4200,11000), rms
    };

      const rate=raw[key]>a[key]?32:6;
      a[key]+=(raw[key]-a[key])*(1-Math.exp(-dt*rate));

    // Exclusive FFT-bin assignment. Each bin contributes to exactly one ring.
    const rises={bass:0,mid:0,high:0},counts={bass:0,mid:0,high:0};

      counts[key]++;

    d.hit=0;d.crash=0;

    const active= Math.max(rms/.022,raw.high/.07,raw.mid/.06);
    const silenceTarget=active<.38?1:0;

    d.structure+=(structureTarget-d.structure)*(1-Math.exp(-dt*(structureTarget>d.structure?7:4)));

}
function applyMidi(message){
  if(!message || typeof message!=='object')return;
  const event=message.event||message.subtype;
  const note=Number(message.note),velocity=Number(message.velocity??0);
  const channel=Number(message.channel??1);

    visual.midi.notes.set(channel+':'+note,Math.min(1,velocity/127));
    visual.midi.pulse=Math.max(visual.midi.pulse,Math.min(1,velocity/127));
  }else if((event==='note_off'||(event==='note_on'&&velocity===0))&&Number.isFinite(note)){
    visual.midi.notes.delete(channel+':'+note);
  }else if(event==='cc'){
    const controller=Number(message.controller??message.cc),value=Number(message.value);
    if(Number.isFinite(controller)&&Number.isFinite(value))visual.midi.cc.set(channel+':'+controller,Math.max(0,Math.min(1,value/127)));
  }else if(event==='pitch_bend'){
    const value=Number(message.value);
    if(Number.isFinite(value))visual.midi.bend=Math.max(-1,Math.min(1,Math.abs(value)>1?(value-8192)/8192:value));

function applyComposition(message){
  if(!message||typeof message!=='object')return;

    if(typeof message[key]==='number'&&Number.isFinite(message[key])){
      visual.targets[key]=Math.max(0,Math.min(1,message[key]));
    }
  }
  if(typeof message.mode==='string')visual.composition.mode=message.mode.slice(0,40);
}
function updateComposition(dt){
  const alpha=1-Math.exp(-dt*.7);
  for(const [key,value] of Object.entries(visual.targets))visual.composition[key]+=(value-visual.composition[key])*alpha;
  visual.midi.pulse*=Math.exp(-dt*10);
}
// Future timestamped events can be scheduled against a measured audio playback offset.
// Until that offset is measured, composition messages are intentionally slow-moving.
function receiveVisualMessage(message){
  if(!message||typeof message!=='object')return;
  if(message.type==='composition')applyComposition(message);
  if(message.type==='midi')applyMidi(message);
}
let telemetrySocket=null;
function connectTelemetry(){
  if(!TELEMETRY_WS_URL)return;
  let retry=1500;
  function connect(){
    try{
      telemetrySocket=new WebSocket(TELEMETRY_WS_URL);
      telemetrySocket.onopen=()=>{visual.connected=true;retry=1500};
      telemetrySocket.onmessage=e=>{

      };
      telemetrySocket.onclose=()=>{visual.connected=false;setTimeout(connect,retry);retry=Math.min(30000,retry*1.6)};
      telemetrySocket.onerror=()=>telemetrySocket.close();
    }catch(e){setTimeout(connect,retry);retry=Math.min(30000,retry*1.6)}

// Local MIDI is opt-in and is intended for development or a private control page.
async function enableLocalMidi(){
  if(!navigator.requestMIDIAccess)throw new Error('Web MIDI unavailable in this browser');
  const access=await navigator.requestMIDIAccess({sysex:false});
  const attach=()=>{
    for(const input of access.inputs.values())input.onmidimessage=e=>{
      const [status,data1,data2]=e.data,command=status&0xf0,channel=(status&0x0f)+1;
      if(command===0x90)applyMidi({event:'note_on',note:data1,velocity:data2,channel});
      else if(command===0x80)applyMidi({event:'note_off',note:data1,velocity:data2,channel});
      else if(command===0xb0)applyMidi({event:'cc',controller:data1,value:data2,channel});
      else if(command===0xe0)applyMidi({event:'pitch_bend',value:data1+data2*128,channel});
    };
  };
  attach();access.onstatechange=attach;
  return access;
}

// Hybrid renderer: original Canvas2D sculpture remains authoritative.
// WebGL ONLY adds a diffuse, low-resolution halo sampled from the original canvas.
// No geometry is redrawn in WebGL, so there are no dashed or disconnected filaments.
const haloCanvas=document.getElementById('halo');
let haloGL=null, haloProgram=null, haloTex=null, haloReady=false, haloFrame=0;
try{
 const gl=haloCanvas.getContext('webgl',{alpha:true,antialias:false,premultipliedAlpha:false,depth:false,stencil:false,preserveDrawingBuffer:false});
 if(!gl)throw Error('WebGL not available');
 const shader=(type,source)=>{const sh=gl.createShader(type);gl.shaderSource(sh,source);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh};
 const vs=shader(gl.VERTEX_SHADER,'attribute vec2 p; varying vec2 uv; void main(){uv=(p+1.0)*0.5; gl_Position=vec4(p,0.0,1.0);}');
 const fs=shader(gl.FRAGMENT_SHADER,`precision highp float;
 varying vec2 uv; uniform sampler2D sourceTex; uniform vec2 texel;
 // Source image includes a navy background. Remove it BEFORE generating glow.
 // Extract only the chromatic excess of the original teal, violet and amber fibers.
 vec3 fiber(vec2 q){
   vec3 c=texture2D(sourceTex,clamp(q,vec2(0.0),vec2(1.0))).rgb;
   // The backdrop has a blue bias. Strong chromatic excess isolates filament light.
   vec3 bg=vec3(0.11,0.20,0.31);
   vec3 excess=max(c-bg,vec3(0.0));
   float strength=max(excess.r,max(excess.g,excess.b));
   float mask=smoothstep(0.15,0.46,strength);
   // No normalization or saturation amplification: source RGB remains authoritative.
   return excess*mask;
